<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>AeTher Explorer - Strona Główna</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #e0f2fe;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        .logo-container {
            margin-bottom: 20px;
        }
        .logo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }
        h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #94a3b8;
            font-style: italic;
            margin-bottom: 30px;
        }
        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 450px;
            margin: 0 auto;
        }
        .slot-btn {
            display: block;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-weight: bold;
            transition: 0.2s;
        }
        .slot-btn:hover {
            background-color: #38bdf8;
            color: #0b0f19;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img class="logo" src="https://github.com/fortunanikodem00-a11y/aether/blob/imgs-source/aether.jpg?raw=true" alt="AeTher Explorer Logo">
    </div>

    <h1>AeTher ExploRer</h1>
    <p class="subtitle">Nadeszło zbawienie</p>

    <div class="slots-container">
        <!-- Przejście do sekcji Wiadomości -->
        <a class="slot-btn" href="https://raw.githubusercontent.com/fortunanikodem00-a11y/aether/refs/heads/main/news.html">📰 Wiadomości Systemowe</a>

        <!-- Przejście do D-Hero Store -->
        <a class="slot-btn" href="https://raw.githubusercontent.com/fortunanikodem00-a11y/aether/refs/heads/main/dhero%20app%20store%20for%20dhero%20kernel.html">🛒 D-Hero Store (Aplikacje i Pliki)</a>

        <!-- Informacje o Systemie -->
        <a class="slot-btn" href="https://raw.githubusercontent.com/fortunanikodem00-a11y/aether/refs/heads/main/sytem%20info.html">💻 Informacje o PROND SHOCK OS</a>

        <!-- Link zewnętrzny -->
        <a class="slot-btn" href="https://www.youtube.com">▶ YouTube (Tryb sieciowy, może nie działać)</a>
    </div>

</body>
</html>
